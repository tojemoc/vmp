name: Deploy
permissions:
  contents: read
# Deploy does not use Nx Cloud — avoids a 500-credit CIPE per main/tag push.
# PR CI (ci.yml) keeps Nx Cloud for remote cache and self-healing.
on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    # Path filters apply to branch pushes only; tag pushes always deploy (production).
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.cursor/**'
      - '.agents/**'
      - '.opencode/**'
      - '.github/skills/**'
      - '.github/prompts/**'
      - '.github/agents/**'
      - 'apps/mobile/**'
      - 'packages/media-pipeline/**'
      - 'packages/moq-probe/**'
      - 'packages/offloading/**'
      - '.github/workflows/media-pipeline-docker.yml'
      - '.github/workflows/mobile-artifacts.yml'
      - '.github/workflows/ort-scan.yml'
      - '.github/workflows/stickydisk-cleanup.yml'
      - '.github/workflows/bot-review-limit-cron.yml'
      - '.github/workflows/coderabbit-instant-trigger.yml'
      - '.github/workflows/dependabot-auto-merge.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.target || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')) || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: staging
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: lts/*
          cache: npm

      - name: Deploy staging Cloudflare API and Web
        uses: ./.github/actions/deploy-cloudflare
        with:
          deploy-tier: staging
          api-base-url: ${{ vars.API_URL_STAGING }}
          frontend-url: ${{ vars.FRONTEND_URL_STAGING }}
          expected-allowed-origins: ${{ vars.ALLOWED_ORIGINS_STAGING }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN_STAGING }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_STAGING }}
          deploy-smoke-auth-token: ${{ secrets.STAGING_DEPLOY_SMOKE_AUTH_TOKEN }}
          web-deploy-args: --config wrangler.workers.toml
          git-sha: ${{ github.sha }}
          ui-locale: ${{ vars.NUXT_PUBLIC_UI_LOCALE }}
          sentry-dsn: ${{ vars.NUXT_PUBLIC_SENTRY_DSN }}
          posthog-key: ${{ vars.NUXT_PUBLIC_POSTHOG_KEY }}
          posthog-project-token: ${{ vars.NUXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          posthog-host: ${{ vars.NUXT_PUBLIC_POSTHOG_HOST }}
          posthog-project-id: ${{ vars.POSTHOG_PROJECT_ID }}
          posthog-personal-api-key: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          mobile-android-cert-fingerprints: ${{ vars.MOBILE_ANDROID_SHA256_CERT_FINGERPRINTS_STAGING }}
          mobile-apple-app-ids: ${{ vars.MOBILE_APPLE_APP_IDS_STAGING }}
          mobile-android-package: ${{ vars.MOBILE_ANDROID_PACKAGE_STAGING }}

  deploy-production:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: lts/*
          cache: npm

      - name: Deploy production Cloudflare API and Web
        uses: ./.github/actions/deploy-cloudflare
        with:
          deploy-tier: production
          api-base-url: ${{ vars.API_URL_PROD }}
          frontend-url: ${{ vars.FRONTEND_URL_PROD }}
          expected-allowed-origins: ${{ vars.ALLOWED_ORIGINS_PROD }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN_PROD }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PROD }}
          deploy-smoke-auth-token: ${{ secrets.PROD_DEPLOY_SMOKE_AUTH_TOKEN }}
          web-deploy-args: --config wrangler.workers.toml --env production
          git-sha: ${{ github.sha }}
          app-version: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          ui-locale: ${{ vars.NUXT_PUBLIC_UI_LOCALE }}
          sentry-dsn: ${{ vars.NUXT_PUBLIC_SENTRY_DSN }}
          posthog-key: ${{ vars.NUXT_PUBLIC_POSTHOG_KEY }}
          posthog-project-token: ${{ vars.NUXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          posthog-host: ${{ vars.NUXT_PUBLIC_POSTHOG_HOST }}
          posthog-project-id: ${{ vars.POSTHOG_PROJECT_ID }}
          posthog-personal-api-key: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          mobile-android-cert-fingerprints: ${{ vars.MOBILE_ANDROID_SHA256_CERT_FINGERPRINTS_PROD }}
          mobile-apple-app-ids: ${{ vars.MOBILE_APPLE_APP_IDS_PROD }}
          mobile-android-package: ${{ vars.MOBILE_ANDROID_PACKAGE_PROD }}
