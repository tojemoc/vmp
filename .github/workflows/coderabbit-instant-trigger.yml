# .github/workflows/coderabbit-instant-trigger.yml
#
# CodeRabbit, on repos with <10 stars, posts a comment saying reviews must be
# triggered manually. There's no wait involved here, so we just reply
# immediately with "@coderabbitai review" the moment that comment appears
# (or is edited into that state).
#
# Why `types: [created, edited]`: CodeRabbit sometimes edits its existing
# comment in place instead of posting a new one. A workflow that only
# listens for `created` will miss those updates entirely.
#
# Uses inline Node (not actions/github-script) to avoid codeload 429s when
# GitHub rate-limits action archive downloads.

name: CodeRabbit instant re-trigger

on:
  issue_comment:
    types: [created, edited]

permissions:
  issues: write
  pull-requests: write

jobs:
  retrigger:
    # Only run on PR comments (issue_comment fires for plain issues too)
    # authored by the coderabbitai bot.
    if: >
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == 'coderabbitai[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Re-trigger review if manual-trigger message is present
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/coderabbit-instant-retrigger.mjs
