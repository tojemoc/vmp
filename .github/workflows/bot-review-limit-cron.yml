# .github/workflows/bot-review-limit-cron.yml
#
# Handles CodeRabbit's "Review limit reached... Next review available in:
# X minutes" message. We can't wait X minutes inside a job (that burns
# Action minutes the whole time), so instead a lightweight cron job runs
# every 15 minutes, checks whether the wait window has already elapsed for
# any open PR, and only then posts the retry comment.
#
# Note: the rate-limit message addresses whoever's push triggered it (e.g.
# "@cursor[bot], you've reached your PR review limit") — that's just naming
# the commit author, not a second bot to watch. The comment itself is
# always posted by coderabbitai[bot], which is what we filter on below.
#
# Trade-off to know about: this has up to ~15 min of slop versus firing the
# instant the timer expires. Tighten the cron schedule (e.g. */5) if you
# want less slop, at the cost of more scheduled runs (still far cheaper than
# a sleeping job).
#
# Uses inline Node (not actions/github-script) to avoid codeload 429s when
# GitHub rate-limits action archive downloads.

name: CodeRabbit review-limit retry (cron)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}   # lets you run it manually to test

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: coderabbit-review-limit-retry
  cancel-in-progress: false

jobs:
  retry-rate-limited-reviews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Retry elapsed rate-limited reviews
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/coderabbit-review-limit-retry.mjs
