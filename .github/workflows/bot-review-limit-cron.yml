# .github/workflows/bot-review-limit-cron.yml
#
# Handles CodeRabbit's "Review limit reached... Next review available in:
# X minutes" message. We can't wait X minutes inside a job (that burns
# Action minutes the whole time), so instead a lightweight cron job runs
# every 15 minutes, checks whether the wait window has already elapsed for
# any open PR, and only then posts the retry comment.
#
# Note: the rate-limit message addresses whoever's push triggered it (e.g.
# "@cursor[bot], you've reached your PR review limit") — that's just naming
# the commit author, not a second bot to watch. The comment itself is
# always posted by coderabbitai[bot], which is what we filter on below.
#
# Trade-off to know about: this has up to ~15 min of slop versus firing the
# instant the timer expires. Tighten the cron schedule (e.g. */5) if you
# want less slop, at the cost of more scheduled runs (still far cheaper than
# a sleeping job).

name: CodeRabbit review-limit retry (cron)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}   # lets you run it manually to test

permissions:
  issues: write
  pull-requests: read

jobs:
  retry-rate-limited-reviews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const BOT_LOGIN = 'coderabbitai[bot]';
            const TRIGGER_PHRASE = '@coderabbitai review';

            const openPRs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });

            for (const pr of openPRs) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });

              const botComments = comments.filter(c => c.user.login === BOT_LOGIN);
              if (botComments.length === 0) continue;

              const last = botComments[botComments.length - 1];
              const match = last.body.match(/next review available in:\s*(\d+)\s*minutes?/i);
              if (!match) continue; // not currently rate-limited

              const waitMinutes = parseInt(match[1], 10);
              // updated_at reflects when the bot last edited the countdown
              // text, so treat the wait as counted from there.
              const countdownSetAt = new Date(last.updated_at || last.created_at);
              const eta = new Date(countdownSetAt.getTime() + waitMinutes * 60_000);

              if (new Date() < eta) {
                console.log(`PR #${pr.number}: still limited until ${eta.toISOString()}`);
                continue;
              }

              // Idempotency: skip if we already posted the retry comment
              // after this rate-limit notice was set.
              const alreadyRetried = comments.some(c =>
                c.user.login === 'github-actions[bot]' &&
                c.body.trim() === TRIGGER_PHRASE &&
                new Date(c.created_at) > countdownSetAt
              );
              if (alreadyRetried) {
                console.log(`PR #${pr.number}: already retried, skipping.`);
                continue;
              }

              console.log(`PR #${pr.number}: wait window elapsed, posting retry.`);
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number, body: TRIGGER_PHRASE,
              });
            }
