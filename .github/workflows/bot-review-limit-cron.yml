# .github/workflows/bot-review-limit-cron.yml
#
# Optional cheaper alternative to Cursor-owned rate-limit waits.
#
# Prefer `.github/workflows/coderabbit-cursor-relay.yml` + the Cursor
# automation (see `.github/CODERABBIT_CURSOR_AUTOMATION.md`) when you want
# one loop that both waits out CodeRabbit limits and applies review fixes.
# Keep THIS workflow disabled in that setup so you do not double-post
# `@coderabbitai review`.
#
# Enable this cron instead when you only want Actions to retry reviews after
# "Review limit reached... Next included review available in N minutes"
# without waking a Cursor agent (saves cloud-agent minutes; up to ~15 min
# of slop vs the timer).
#
# Note: the rate-limit message addresses whoever's push triggered it (e.g.
# "@cursor[bot], you've reached your PR review limit") — that's just naming
# the commit author, not a second bot to watch. The comment itself is
# always posted by coderabbitai[bot], which is what we filter on below.
#
# Uses inline Node (not actions/github-script) to avoid codeload 429s when
# GitHub rate-limits action archive downloads.

name: CodeRabbit review-limit retry (cron)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}   # lets you run it manually to test

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: coderabbit-review-limit-retry
  cancel-in-progress: false

jobs:
  retry-rate-limited-reviews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Retry elapsed rate-limited reviews
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/coderabbit-review-limit-retry.mjs
