name: Publish SideStore Pages

# Rebuilds https://tojemoc.github.io/vmp/ (altstore-source.json, install page,
# downloads.json with nightly.link URLs) via actions/deploy-pages.
#
# Use this when the install site is missing or stale — especially after someone
# re-ran GitHub's dynamic "pages-build-deployment" workflow (no workflow file;
# it deploys raw /docs markdown/templates and wipes the Actions-published site).
#
# Do NOT re-run Actions → pages-build-deployment to refresh nightly links.

on:
  workflow_dispatch:
    inputs:
      mobile_artifacts_run_id:
        description: Mobile artifacts run ID for nightly.link URLs (empty = latest successful main run with ios-ipa)
        required: false
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: publish-sidestore-pages
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Guard main only
        if: ${{ github.ref != 'refs/heads/main' }}
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          echo "::error::Publish SideStore Pages is only allowed from main (got ${DISPATCH_REF})."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Generate AltStore source from GitHub Releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/generate-altstore-source.py

      - name: Build Pages site (install page + nightly.link downloads.json)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
          MOBILE_ARTIFACTS_RUN_ID: ${{ inputs.mobile_artifacts_run_id }}
        run: python3 scripts/build-sidestore-pages-site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
