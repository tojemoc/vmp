# Optional NVIDIA GPU override for encore-web (single-node encode).
# Usage: docker compose -f encore/docker-compose.yml -f encore/docker-compose.nvidia.yml up -d
#
# For scaled workers, use docker-compose.scale.nvidia.yml with docker-compose.scale.yml.

services:
  encore-web:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
